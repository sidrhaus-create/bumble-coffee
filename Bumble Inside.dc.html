<script type="text/x-dc" data-dc-script>
const COLORS = ['#F23904','#BB0D0A','#A21D11','#CA1181','#E60F13','#81377A'];

class Component extends DCLogic {
  componentDidMount(){ this.mount(); }
  componentDidUpdate(){ this.mount(); }

  mount(){
    const stage = document.querySelector('[data-inside]');
    if (!stage) return;
    this.stage = stage;
    this.scroller = document.querySelector('[data-inside-scroll]');
    this.band = stage.querySelector('[data-band]');
    this.deep = stage.querySelector('[data-deep]');
    this.canWrap = stage.querySelector('[data-can]');
    this.cans = [0,1,2,3,4,5].map(i => stage.querySelector('[data-c' + i + ']'));
    this.phases = Array.from(stage.querySelectorAll('[data-ph]')).map(el => {
      const v = el.dataset.ph.split(',').map(Number);
      /* the band's ticker lines are pinned: no parallax drift, so left and
         right hold exactly the same baseline */
      return { el, a: v[0], b: v[1], rise: v[2], depth: v[3], pin: el.hasAttribute('data-in-spec') };
    });
    this.accents = Array.from(stage.querySelectorAll('[data-accent]'));
    this.clipLayer = stage.querySelector('[data-clip]');

    this.flavor = undefined;   /* fresh DOM: re-apply the can and colours */
    this.setFlavor((window.BUMBLE_FLAVOR && window.BUMBLE_FLAVOR.index) || 0);
    this.tuned = false;
    this.mobileTune();

    if (!this.wired){
      this.wired = true;
      this.onScroll = () => this.apply();
      window.addEventListener('scroll', this.onScroll, { passive: true });
      window.addEventListener('resize', () => { this.mobileTune(); this.apply(); });
      document.addEventListener('bumble:flavor', e => this.setFlavor(e.detail.index));
    }
    this.apply();
  }

  componentWillUnmount(){
    window.removeEventListener('scroll', this.onScroll);
    window.removeEventListener('resize', this.onScroll);
  }

  /* the poster is authored in vw — on a phone the small labels would land at
     3px, so every vw font size below the display sizes gets a px value and the
     can is re-proportioned for portrait. Desktop values are restored verbatim. */
  mobileTune(){
    const m = window.innerWidth <= 768;
    const stage = this.stage;
    if (!stage) return;
    if (m === this.mob && this.tuned){ if (m){ this.bigType(true); this.fitSpec(true); } return; }
    this.mob = m;
    this.tuned = true;
    Array.from(stage.querySelectorAll('*')).forEach(el => {
      const cur = el.getAttribute('style') || '';
      if (m){
        if (el.dataset.vwOrig !== undefined) return;
        const mt = /font-size:\s*([\d.]+)vw/.exec(cur);
        if (!mt) return;
        const v = +mt[1];
        if (v >= 8) return;                       /* display numerals scale fine */
        el.dataset.vwOrig = mt[1] + 'vw';
        el.style.fontSize = v >= 5 ? '34px' : (v >= 2 ? '19px' : '10px');
      } else if (el.dataset.vwOrig !== undefined){
        el.style.fontSize = el.dataset.vwOrig;
        delete el.dataset.vwOrig;
      }
    });
    /* portrait closing screen: the statement takes the left column, the can
       holds the right — an editorial split rather than a centred poster */
    const slogan = stage.querySelector('[data-in-slogan]');
    if (slogan){
      slogan.style.left = m ? '24px' : '5.4%';
      slogan.style.width = m ? '56vw' : '';
      slogan.style.top = m ? '23%' : '24%';
      slogan.style.fontSize = m ? '24px' : '3.05vw';
      slogan.style.lineHeight = m ? '1.1' : '1.16';
      slogan.style.zIndex = m ? '7' : '6';
      if (m) delete slogan.dataset.vwOrig;
    }
    this.bigType(m);
    /* the two micro-lines stack on a phone instead of colliding on one baseline,
       and stay tucked just under the product */
    Array.from(stage.querySelectorAll('[data-in-spec]')).forEach((el, i) => {
      el.style.bottom = m ? (i === 0 ? '30px' : '58px') : '12.5%';
      el.style.letterSpacing = m ? '.16em' : '.3em';
      el.style.whiteSpace = m ? 'nowrap' : '';
      if (i === 1) el.style.marginRight = m ? '-.16em' : '-.3em';
    });
    this.fitSpec(m);
    if (this.band) this.band.style.height = m ? '46%' : '38%';
    if (this.deep) this.deep.style.height = m ? '108svh' : '152vh';
    if (this.canWrap){
      /* portrait is a two-column relationship: type owns the left 60vw, the can
         owns the right edge. Nothing important is ever behind it. */
      this.canWrap.style.height = m ? '44svh' : '62vh';
      this.canWrap.style.width = m ? '16svh' : '23vh';
      this.canWrap.style.left = m ? '82%' : '73%';
      this.canWrap.style.top = m ? '54%' : '52%';
    }
    if (this.scroller) this.scroller.style.height = m ? '392svh' : '460vh';
    stage.style.height = m ? '100svh' : '100vh';
  }

  /* the descriptor gained СОК — on a phone the tracking gives way before the type
     size does, so the line keeps one baseline and never overflows. Re-run once the
     Unbounded webfont has actually swapped in, or the measurement is of fallback
     metrics and the line grows past the edge afterwards. */
  fitSpec(m){
    const el = this.stage && this.stage.querySelector('[data-in-spec]');
    if (!el) return;
    if (!m){ el.style.letterSpacing = '.3em'; return; }
    const room = this.stage.clientWidth - el.offsetLeft - 14;
    let ls = 0.16;
    el.style.letterSpacing = '.16em';
    while (el.offsetWidth > room && ls > 0.02){
      ls -= 0.01;
      el.style.letterSpacing = ls.toFixed(2) + 'em';
    }
    if (!this.specWatch){
      this.specWatch = true;
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.fitSpec(window.innerWidth <= 768));
      [400, 1400, 3000].forEach(ms => setTimeout(() => this.fitSpec(window.innerWidth <= 768), ms));
    }
  }

  /* the four display words are the one place type and can could collide.
     On a phone they take a fixed left column, sit ABOVE the can in the stack
     (one predictable z-index for the whole scroll, never traded mid-scroll)
     and shrink until the complete word fits that column. */
  bigType(m){
    const maxW = window.innerWidth * 0.58;
    Array.from(this.stage.querySelectorAll('[data-in-big]')).forEach(el => {
      if (el.dataset.bigFs === undefined){
        el.dataset.bigFs = el.style.fontSize;
        el.dataset.bigLeft = el.style.left;
        el.dataset.bigZ = el.style.zIndex || '';
      }
      if (!m){
        el.style.fontSize = el.dataset.bigFs;
        el.style.left = el.dataset.bigLeft;
        el.style.zIndex = el.dataset.bigZ;
        return;
      }
      el.style.left = '24px';
      el.style.zIndex = '7';
      let fs = parseFloat(el.dataset.mFs || '40');
      el.style.fontSize = fs + 'px';
      /* fractional measurement: offsetWidth rounds, and a rounded-down reading
         let a word stay one step too wide once the real font was in */
      const wide = () => el.getBoundingClientRect().width > maxW;
      for (let n = 0; n < 24 && wide() && fs > 24; n++){
        fs = Math.max(24, fs - Math.max(0.8, fs * 0.035));
        el.style.fontSize = fs.toFixed(1) + 'px';
      }
    });
    /* the first pass measures fallback metrics — Unbounded is wider, so the words
       have to be re-fitted once it has actually swapped in (same guard as fitSpec) */
    if (!this.bigWatch){
      this.bigWatch = true;
      if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => this.bigType(window.innerWidth <= 768));
      [400, 1400, 3000].forEach(ms => setTimeout(() => this.bigType(window.innerWidth <= 768), ms));
    }
  }

  setFlavor(i){
    if (this.flavor === i) return;
    this.flavor = i;
    const c = COLORS[i] || COLORS[0];
    this.band.style.background = c;
    this.cans.forEach((el, j) => { if (el) el.style.opacity = j === i ? 1 : 0; });
    this.accents.forEach(el => { el.style.color = c; });
  }

  apply(){
    const sc = this.scroller, vh = window.innerHeight;
    const rect = sc.getBoundingClientRect();
    const span = sc.offsetHeight - vh;
    const p = Math.max(0, Math.min(1, -rect.top / span));
    const io = t => 1 - Math.pow(1 - t, 2.2);
    const cl = t => Math.max(0, Math.min(1, t));

    /* the two horizontal worlds open up as the section takes over */
    /* the entrance is driven by the section's approach, not by its own track:
       the band and the can are already in place by the time it owns the screen,
       so the outgoing panel never hands over to a blank stretch */
    const ent = cl((vh - rect.top) / (vh * 0.78));
    const entE = io(ent);
    this.band.style.transform = 'scaleY(' + entE.toFixed(3) + ')';

    /* deep layer: slowest of all */
    this.deep.style.transform = 'translate(-50%,' + (-50 - p * 5).toFixed(2) + '%) scale(' + (1 + p * 0.06).toFixed(3) + ')';

    /* selected can: enters from below, then moves less than everything else */
    /* on a phone the can is in place almost immediately, so the screen is
       never empty while the previous section has already let go */
    const inT = entE;
    const sc2 = 0.62 + 0.38 * inT;
    const drift = -p * 26 - (p > 0.9 ? 0 : 0);
    this.canWrap.style.transform = 'translate(-50%,' + (-50 + (1 - inT) * 46).toFixed(2) + '%) translateY(' + drift.toFixed(1) + 'px) scale(' + sc2.toFixed(3) + ')';

    this.phases.forEach(ph => {
      const tIn = ph.a === 0 ? ent : cl((p - ph.a) / 0.055);
      const tOut = cl((p - (ph.b - 0.055)) / 0.055);
      const o = io(tIn) * (1 - tOut);
      const drift = ph.pin ? 0 : (p - ph.a) * 40 * ph.depth * (o > 0 ? 1 : 0);
      const y = (1 - io(tIn)) * ph.rise - tOut * tOut * ph.rise * 1.5 - drift;
      ph.el.style.opacity = o.toFixed(3);
      ph.el.style.transform = 'translateY(' + y.toFixed(1) + 'px)';
    });

    /* the front copy of 0% is clipped to the can's right half, so the can
       genuinely passes behind part of the glyph */
    if (this.clipLayer){
      const cr = this.canWrap.getBoundingClientRect(), w = this.stage.offsetWidth || 1;
      const pct = Math.max(0, Math.min(100, (cr.left + cr.width * 0.46) / w * 100));
      this.clipLayer.style.clipPath = 'inset(0 0 0 ' + pct.toFixed(2) + '%)';
    }

    /* carbonation only in the FIZZ movement */
    const fizz = document.querySelector('[data-fizz]');
    if (fizz) fizz.style.opacity = (cl((p - 0.78) / 0.06) * (1 - cl((p - 0.97) / 0.04))).toFixed(3);
  }

  renderVals(){ return {}; }
}
</script>
