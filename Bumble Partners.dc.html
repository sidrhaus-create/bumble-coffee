<helmet>
<style>
@font-face{font-family:Unbounded;src:url(assets/fonts/unbounded-cyrillic-400.woff2) format('woff2');font-weight:400;font-display:swap;unicode-range:U+0400-04FF,U+2116}

<div style="font-family:Unbounded,system-ui,sans-serif;color:#14100E;background:#FAEED4">

            <span data-pt-err style="display:block;height:0;overflow:hidden;font-size:clamp(9px,.6vw,11px);font-weight:700;letter-spacing:.16em;color:#B3261E;transition:height .26s ease,opacity .26s ease;opacity:0"></span>

            <input data-pt-input id="pt-email" name="email" type="email" autocomplete="email" placeholder="name@company.ru" style="display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:0 0 12px;border:0;background:none;font-family:inherit;font-size:clamp(15px,1.15vw,23px);font-weight:700;letter-spacing:-.015em;color:#14100E;outline:none"/>
            <span style="display:block;height:1px;background:rgba(20,16,14,.22)"></span>
            <span data-pt-under style="position:absolute;left:0;right:0;bottom:0;height:2px;background:#81377B;transform:scaleX(0);transform-origin:left center;transition:transform .42s cubic-bezier(.16,1,.3,1)"></span>
            <span data-pt-err style="display:block;height:0;overflow:hidden;font-size:clamp(9px,.6vw,11px);font-weight:700;letter-spacing:.16em;color:#B3261E;transition:height .26s ease,opacity .26s ease;opacity:0"></span>
          </div>

          <div data-pt-row="3" style="position:relative;padding-top:clamp(18px,2.6vh,30px);opacity:0;transform:translateY(18px)">
            <label data-pt-label for="pt-subject" style="display:block;font-size:clamp(9px,.6vw,11px);font-weight:700;letter-spacing:.28em;color:rgba(20,16,14,.5);transition:transform .32s cubic-bezier(.16,1,.3,1),color .32s ease">ТЕМА ОБРАЩЕНИЯ</label>
            <select data-pt-input id="pt-subject" name="subject" required style="display:block;width:100%;box-sizing:border-box;margin-top:10px;padding:0 26px 12px 0;border:0;border-radius:0;background:none;font-family:inherit;font-size:clamp(15px,1.15vw,23px);font-weight:700;letter-spacing:-.015em;color:#14100E;outline:none;appearance:none;-webkit-appearance:none;cursor:pointer">
              <option value="">Выберите тему</option>
              <option value="СОТРУДНИЧЕСТВО">СОТРУДНИЧЕСТВО</option>
              <option value="ДИСТРИБУЦИЯ">ДИСТРИБУЦИЯ</option>
              <option value="РИТЕЙЛ">РИТЕЙЛ</option>
              <option value="HoReCa">HoReCa</option>
              <option value="ДОСТАВКА">ДОСТАВКА</option>
              <option value="ДРУГОЕ">ДРУГОЕ</option>
            </select>
            <span data-pt-chev style="position:absolute;right:2px;bottom:16px;width:9px;height:9px;border-right:2px solid rgba(20,16,14,.45);border-bottom:2px solid rgba(20,16,14,.45);transform:rotate(45deg);pointer-events:none;transition:transform .3s ease"></span>
            <span style="display:block;height:1px;background:rgba(20,16,14,.22)"></span>

            <span data-pt-err style="display:block;height:0;overflow:hidden;font-size:clamp(9px,.6vw,11px);font-weight:700;letter-spacing:.16em;color:#B3261E;transition:height .26s ease,opacity .26s ease;opacity:0"></span>
          </div>

              <span data-pt-wipe style="position:absolute;inset:0;background:#81377B;transform:scaleY(0);transform-origin:center bottom;transition:transform .52s cubic-bezier(.22,1,.28,1)"></span>

        <div data-pt-done style="display:none;padding-top:clamp(20px,3vh,34px)">

          <div style="overflow:hidden;padding-bottom:.06em"><div data-pt-done-line style="font-size:clamp(26px,2.9vw,58px);font-weight:800;letter-spacing:-.035em;line-height:1.06;transform:translateY(112%)">СВЯЖЕМСЯ С ВАМИ.</div></div>
          <div data-pt-done-note style="margin-top:clamp(16px,2.4vh,26px);display:flex;align-items:center;gap:12px;opacity:0;transform:translateY(14px)">

            <span style="font-size:clamp(9px,.62vw,12px);font-weight:700;letter-spacing:.28em;color:rgba(20,16,14,.55)">ЗАЯВКА ПРИНЯТА</span>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;endpoint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;/api/partners&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Отправка заявки&quot;},&quot;recipient&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;PARTNERS_EMAIL&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;section&quot;:&quot;Отправка заявки&quot;}}">
const COLORS = ['#F23904','#BB0D0A','#A21D11','#CA1181','#E60F13','#81377A'];
const RE_MAIL = /^[^\s@]+@[^\s@]+\.[a-zA-Zа-яА-Я]{2,}$/;

class Component extends DCLogic {
  componentDidMount(){ this.mount(); }
  componentDidUpdate(){ this.mount(); }

  mount(){
    const root = document.querySelector('[data-pt]');
    if (!root) return;
    this.root = root;
    this.form = root.querySelector('[data-pt-form]');
    this.rows = Array.from(root.querySelectorAll('[data-pt-row]'));
    this.revs = Array.from(root.querySelectorAll('[data-pt-rev]'));
    this.lines = Array.from(root.querySelectorAll('[data-pt-line]'));
    this.done = root.querySelector('[data-pt-done]');
    this.doneLines = Array.from(root.querySelectorAll('[data-pt-done-line]'));
    this.doneNote = root.querySelector('[data-pt-done-note]');
    this.btn = root.querySelector('[data-pt-submit]');
    this.wipe = root.querySelector('[data-pt-wipe]');
    this.btnText = root.querySelector('[data-pt-btn-text]');
    this.btnLabel = root.querySelector('[data-pt-btn-label]');
    this.btnArrow = root.querySelector('[data-pt-btn-arrow]');
    this.fields = ['name','phone','email','subject'].map(n => ({
      name: n,
      el: root.querySelector('[name="' + n + '"]'),
      row: root.querySelector('[name="' + n + '"]').closest('[data-pt-row]')
    }));

    this.teardown();
    this.wired = true;
    this.setFlavor((window.BUMBLE_FLAVOR && window.BUMBLE_FLAVOR.index) || 0);

    this.handlers = [];
    const bind = (el, ev, fn) => { el.addEventListener(ev, fn); this.handlers.push([el, ev, fn]); };

    this.fields.forEach(f => {
      const under = f.row.querySelector('[data-pt-under]');
      const label = f.row.querySelector('[data-pt-label]');
      bind(f.el, 'focus', () => {
        under.style.transform = 'scaleX(1)';
        label.style.transform = 'translateY(-3px)';
        label.style.color = this.accent;
      });
      bind(f.el, 'blur', () => {
        const filled = !!f.el.value.trim();
        under.style.transform = filled ? 'scaleX(1)' : 'scaleX(0)';
        under.style.opacity = filled ? '.4' : '1';
        label.style.transform = 'translateY(0)';
        label.style.color = 'rgba(20,16,14,.5)';
      });
      bind(f.el, 'input', () => this.clearError(f));
      bind(f.el, 'change', () => this.clearError(f));
    });

    bind(this.btn, 'pointerenter', () => this.hover(true));
    bind(this.btn, 'pointerleave', () => this.hover(false));
    bind(this.form, 'submit', e => { e.preventDefault(); this.submit(); });

    this.onFlavor = e => this.setFlavor(e.detail.index);
    document.addEventListener('bumble:flavor', this.onFlavor);

    if (!this.revealed){
      this.io = new IntersectionObserver(entries => {
        if (entries.some(en => en.isIntersecting)) this.reveal();
      }, { threshold: 0.16 });
      this.io.observe(root);
    }
  }

  componentWillUnmount(){ this.teardown(); }

  teardown(){
    if (!this.wired) return;
    (this.handlers || []).forEach(([el, ev, fn]) => el.removeEventListener(ev, fn));
    this.handlers = [];
    document.removeEventListener('bumble:flavor', this.onFlavor);
    if (this.io){ this.io.disconnect(); this.io = null; }
    this.wired = false;
  }

  setFlavor(i){
    const c = COLORS[i] || COLORS[0];
    this.accent = c;
    this.root.querySelectorAll('[data-pt-accent]').forEach(el => { el.style.color = c; });
    this.root.querySelectorAll('[data-pt-under]').forEach(el => { el.style.background = c; });
    this.root.querySelectorAll('[data-pt-dot]').forEach(el => { el.style.background = c; });
    if (this.wipe) this.wipe.style.background = c;
  }

  /* headline masks up, copy staggers in, then the form rows draw one by one */
  reveal(){
    if (this.revealed) return;
    this.revealed = true;
    const ease = 'cubic-bezier(.16,1,.3,1)';
    this.lines.forEach((el, i) => {
      el.style.transition = 'transform .86s ' + ease + ' ' + (0.06 + i * 0.09) + 's';
      el.style.transform = 'translateY(0)';
    });
    this.revs.forEach(el => {
      const i = +el.dataset.ptRev;
      el.style.transition = 'opacity .7s ease ' + (0.26 + i * 0.09) + 's, transform .8s ' + ease + ' ' + (0.26 + i * 0.09) + 's';
      el.style.opacity = 1;
      el.style.transform = 'translateY(0)';
    });
    this.rows.forEach(el => {
      const i = +el.dataset.ptRow;
      const d = 0.42 + i * 0.1;
      el.style.transition = 'opacity .66s ease ' + d + 's, transform .78s ' + ease + ' ' + d + 's';
      el.style.opacity = 1;
      el.style.transform = 'translateY(0)';
    });
    if (this.io){ this.io.disconnect(); this.io = null; }
  }

  hover(on){
    if (this.busy) return;
    this.wipe.style.transform = on ? 'scaleY(1)' : 'scaleY(0)';
    this.btnText.style.transform = on ? 'translateX(6px)' : 'translateX(0)';
    this.btnArrow.style.opacity = on ? 1 : 0;
    this.btnArrow.style.transform = on ? 'translateX(0)' : 'translateX(-8px)';
  }

  error(f, msg){
    const err = f.row.querySelector('[data-pt-err]');
    err.textContent = msg;
    err.style.height = '2.1em';
    err.style.paddingTop = '8px';
    err.style.opacity = 1;
    f.row.querySelector('[data-pt-under]').style.background = '#B3261E';
    f.row.querySelector('[data-pt-under]').style.transform = 'scaleX(1)';
  }

  clearError(f){
    const err = f.row.querySelector('[data-pt-err]');
    if (err.style.opacity === '0' || !err.textContent) return;
    err.style.height = '0';
    err.style.paddingTop = '0';
    err.style.opacity = 0;
    const u = f.row.querySelector('[data-pt-under]');
    u.style.background = this.accent;
    u.style.transform = f.el.value.trim() ? 'scaleX(1)' : 'scaleX(0)';
  }

  validate(){
    const v = {};
    this.fields.forEach(f => { v[f.name] = (f.el.value || '').trim(); });
    let ok = true;
    const fail = (n, m) => { ok = false; this.error(this.fields.find(f => f.name === n), m); };
    if (v.name.length < 2) fail('name', 'УКАЖИТЕ ИМЯ');
    const digits = v.phone.replace(/\D/g, '');
    if (digits.length < 10 || digits.length > 15) fail('phone', 'ПРОВЕРЬТЕ НОМЕР ТЕЛЕФОНА');
    if (!RE_MAIL.test(v.email)) fail('email', 'ПРОВЕРЬТЕ АДРЕС ПОЧТЫ');
    if (!v.subject) fail('subject', 'ВЫБЕРИТЕ ТЕМУ');
    return ok ? v : null;
  }

  /* Frontend code cannot send mail on its own. The lead is POSTed to a server
     endpoint that owns the recipient address and any credentials; until that
     endpoint exists the payload is logged and the UI runs its success path. */
  async send(payload){
    const url = this.props.endpoint || '/api/partners';
    try {
      const res = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      if (!res.ok) throw new Error('HTTP ' + res.status);
      return true;
    } catch (e) {
      console.info('[Bumble] partners lead (endpoint ' + url + ' not connected yet, recipient key: ' + (this.props.recipient || 'PARTNERS_EMAIL') + ')', payload);
      return true;
    }
  }

  async submit(){
    if (this.busy) return;
    const v = this.validate();
    if (!v) return;
    this.busy = true;
    this.btn.disabled = true;
    this.btn.style.cursor = 'default';
    this.btnLabel.textContent = 'ОТПРАВЛЯЕМ...';
    this.btnArrow.style.opacity = 0;
    this.wipe.style.transform = 'scaleY(1)';
    this.rows.forEach((r, i) => {
      const u = r.querySelector('[data-pt-under]');
      if (u){ u.style.transition = 'transform .5s cubic-bezier(.16,1,.3,1) ' + (i * 0.05) + 's'; u.style.transform = 'scaleX(1)'; }
    });

    const payload = { name: v.name, phone: v.phone, email: v.email, subject: v.subject, createdAt: new Date().toISOString() };
    await this.send(payload);
    await new Promise(r => setTimeout(r, 520));
    this.finish();
  }

  finish(){
    const h = this.form.offsetHeight;
    this.form.style.height = h + 'px';
    this.form.style.overflow = 'hidden';
    this.form.style.transition = 'height .62s cubic-bezier(.16,1,.3,1), opacity .34s ease';
    requestAnimationFrame(() => {
      this.form.style.opacity = 0;
      this.form.style.height = '0px';
    });
    setTimeout(() => {
      this.form.style.display = 'none';
      this.done.style.display = 'block';
      requestAnimationFrame(() => {
        this.doneLines.forEach((el, i) => {
          el.style.transition = 'transform .82s cubic-bezier(.16,1,.3,1) ' + (i * 0.09) + 's';
          el.style.transform = 'translateY(0)';
        });
        this.doneNote.style.transition = 'opacity .6s ease .34s, transform .7s cubic-bezier(.16,1,.3,1) .34s';
        this.doneNote.style.opacity = 1;
        this.doneNote.style.transform = 'translateY(0)';
      });
    }, 640);
  }

  renderVals(){ return {}; }
}
</script>
