const IMG = {};
function tint(key, color){
  const s = SVG[key].src
    .replace(/style="fill:[^"]*"/g, '')
    .replace(/class="[^"]*"/g, `fill="${color}"`);
  const im = new Image();
  im.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s);
  return new Promise(r => { im.onload = im.onerror = () => r(im); });
}
// draw logo centered at (cx,cy) by height (h) or width (w)
function logo(name, key, cx, cy, {h, w}){
  const ar = SVG[key].ar;
  if (h) w = h*ar; else h = w/ar;
  x.drawImage(IMG[name], cx - w/2, cy - h/2, w, h);
}

const cv = document.getElementById('c');

let W, H, S, DPR;

  cv.width = W*DPR; cv.height = H*DPR;

}
addEventListener('resize', resize); resize();

/* ---------- таймлайн ---------- */
const L = 14;
const T_DROP = .9, T_CAN = 1.0, T_CHARGE = 1.9, T_BURST = 3.9;
const T_FLAV0 = 5.2, T_FLAV_STEP = 1.3;
const T_WIPE = 12.9, T_END = 13.7;

const clamp = (v,a=0,b=1) => Math.max(a, Math.min(b, v));
const prog = (t,a,b) => clamp((t-a)/(b-a));
const eOut = k => 1 - Math.pow(1-k, 3);
const eIn = k => k*k*k;
const eBack = k => 1 + 2.7*Math.pow(k-1,3) + 1.7*Math.pow(k-1,2);
const eElastic = k => k <= 0 ? 0 : k >= 1 ? 1 : Math.pow(2,-10*k)*Math.sin((k*10-.75)*(2*Math.PI/3)) + 1;
const rnd = (a,b) => a + Math.random()*(b-a);

let t0 = performance.now(), prevT = 0, last = t0;
let mx = 0, my = 0;
let splashed = false, bursted = false, lastFlav = 0;
let beans = [], drops = [], rings = [], streaks = [], floaters = [];

addEventListener('pointermove', e => { mx = e.clientX/W - .5; my = e.clientY/H - .5; });
addEventListener('pointerdown', () => {
  t0 = performance.now() - T_CHARGE*1000;

function flavorAt(t){
  if (t < T_FLAV0) return {i:0, k:1};
  const n = Math.min(FLAVORS.length - 1, 1 + Math.floor((t - T_FLAV0)/T_FLAV_STEP));
  const start = T_FLAV0 + (n-1)*T_FLAV_STEP;
  return {i:n, k:prog(t, start, start + .32)};
}

/* ---------- примитивы ---------- */
function bean(px, py, r, a, col){
  x.save(); x.translate(px, py); x.rotate(a);
  x.fillStyle = col; x.beginPath(); x.ellipse(0, 0, r, r*.7, 0, 0, Math.PI*2); x.fill();
  x.strokeStyle = C.ink; x.lineWidth = r*.17; x.lineCap = 'round';
  x.beginPath(); x.moveTo(-r*.8, 0); x.bezierCurveTo(-r*.3, -r*.4, r*.3, r*.4, r*.8, 0); x.stroke();
  x.restore();
}
function boltPts(a, b, d, out){
  if (d < 5){ out.push(b); return; }
  const m = {x:(a.x+b.x)/2 + (Math.random()-.5)*d, y:(a.y+b.y)/2 + (Math.random()-.5)*d};
  boltPts(a, m, d/2, out); boltPts(m, b, d/2, out);
}
function bolt(ax, ay, bx, by, col){
  const pts = [{x:ax, y:ay}];
  boltPts(pts[0], {x:bx, y:by}, Math.hypot(bx-ax, by-ay)*.38, pts);
  const p = new Path2D(); p.moveTo(ax, ay); pts.forEach(q => p.lineTo(q.x, q.y));
  x.lineJoin = 'round'; x.lineCap = 'round';
  x.strokeStyle = col; x.lineWidth = S*.012; x.stroke(p);
  x.strokeStyle = C.paper; x.lineWidth = S*.003; x.stroke(p);
}
function ecg(p){
  p -= Math.floor(p);
  if (p < .36) return 0;
  if (p < .40) return (p-.36)/.04*.15;
  if (p < .43) return .15 - (p-.40)/.03*.45;
  if (p < .47) return -.3 + (p-.43)/.04*1.3;
  if (p < .51) return 1 - (p-.47)/.04*1.25;
  if (p < .54) return -.25 + (p-.51)/.03*.25;
  return 0;
}

function cap(y, w, hh, bottom){

  x.fillRect(-w/2, bottom ? y + hh*.35 : y + hh*.45, w, Math.max(1, hh*.14));
}

function canFace(w, top, bh, t, fl){
  const bandY = top + bh*.62;

  // цветная полоса вкуса + смена снизу вверх
  const prev = FLAVORS[(fl.i + FLAVORS.length - 1) % FLAVORS.length];

  x.fillStyle = fl.k < 1 ? prev.band : cur.band;
  x.fillRect(-w/2, bandY, w, bh*.4);
  if (fl.k < 1){
    const hh = (top + bh - bandY)*eOut(fl.k);
    x.fillStyle = cur.band; x.fillRect(-w/2, top + bh - hh, w, hh + 1);
  }

  logo('wordInk', 'word', 0, top + bh*.08, {w: w*.74});
  logo('phoenixInk', 'phoenix', 0, top + bh*.27, {h: bh*.22});

  // название вкуса
  const pop = fl.k < 1 ? eBack(fl.k) : 1;
  x.save(); x.translate(0, top + bh*.5); x.scale(pop, pop);
  x.fillStyle = cur.text; x.textAlign = 'center'; x.textBaseline = 'middle';
  let fs = w*.2; x.font = `${fs}px ${SCRIPT}`;
  const mw = x.measureText(cur.name).width;
  if (mw > w*.84){ fs *= w*.84/mw; x.font = `${fs}px ${SCRIPT}`; }
  x.fillText(cur.name, 0, 0);
  x.restore();

  // три зерна
  for (let i = -1; i <= 1; i++) bean(i*w*.21, top + bh*.72, w*.085, Math.PI/2 - .25, C.goldDeep);
  logo('scriptLight', 'script', 0, top + bh*.835, {w: w*.72});
  x.fillStyle = C.paper; x.textAlign = 'center'; x.textBaseline = 'middle';
  x.font = `400 ${w*.042}px ${FONT}`;
  x.fillText('ZERO SUGAR · COFFEE BOOST', 0, top + bh*.915);

  // плоский блик и тень
  x.fillStyle = 'rgba(255,255,255,.28)'; x.fillRect(-w*.36, top, w*.06, bh);
  x.fillStyle = 'rgba(255,255,255,.14)'; x.fillRect(-w*.27, top, w*.025, bh);
  x.fillStyle = 'rgba(20,16,14,.12)'; x.fillRect(w*.3, top, w*.2, bh);
}

function drawCan(cx, cy, w, h, rot, fill, t, fl){
  x.save(); x.translate(cx, cy); x.rotate(rot);
  const capH = h*.035, top = -h/2 + capH, bot = h/2 - capH, bh = bot - top;
  cap(-h/2, w*.9, capH + 1, false);
  cap(bot - 1, w*.9, capH + 1, true);

  const body = new Path2D(); body.roundRect(-w/2, top, w, bh, w*.035);
  // пустая банка: контур + светящийся феникс
  x.fillStyle = C.ink2; x.fill(body);
  logo('phoenixPaper', 'phoenix', 0, top + bh*.27, {h: bh*.22});
  logo('wordPaper', 'word', 0, top + bh*.08, {w: w*.74});

  // заряд: банка наполняется снизу
  const lvl = bot - fill*bh*1.06;
  const amp = w*.04*(fill < 1 ? 1 : 0);
  const liquid = new Path2D();
  liquid.moveTo(-w/2 - 2, bot + 2);
  for (let i = 0; i <= 24; i++) liquid.lineTo(-w/2 + w*i/24, lvl + Math.sin(i*.7 + t*9)*amp);
  liquid.lineTo(w/2 + 2, bot + 2); liquid.closePath();

  x.save(); x.clip(body); x.clip(liquid); canFace(w, top, bh, t, fl); x.restore();
  x.strokeStyle = C.paper; x.lineWidth = Math.max(1.5, w*.01);
  x.globalAlpha = 1 - clamp(fill*1.2); x.stroke(body); x.globalAlpha = 1;
  x.restore();
}

/* ---------- заголовок ---------- */
function wordLayout(word, fs){
  x.font = `800 ${fs}px ${FONT}`;
  const tr = fs*.01;
  const ws = [...word].map(ch => x.measureText(ch).width);
  return {ws, tr, total: ws.reduce((a,b) => a+b, 0) + tr*(ws.length-1)};
}
function drawWord(word, cy, fs, start, t, mode, col, glitch){
  const {ws, total, tr} = wordLayout(word, fs);
  let px = W/2 - total/2;
  x.textAlign = 'center'; x.textBaseline = 'middle';
  [...word].forEach((ch, i) => {
    const lt = prog(t, start + i*.045, start + i*.045 + .38);
    const lx = px + ws[i]/2; px += ws[i] + tr;
    if (lt <= 0) return;
    const sc = 1 + (1 - eOut(lt))*2.6;
    x.save(); x.translate(lx, cy); x.scale(sc, sc); x.globalAlpha = clamp(lt*2.2);
    if (glitch){
      const gx = (Math.random()-.5)*fs*.12;
      x.fillStyle = C.accent; x.fillText(ch, gx - fs*.03, 0);
      x.fillStyle = C.paper;  x.fillText(ch, -gx + fs*.03, 0);
    }
    if (mode === 'fill'){ x.fillStyle = col; x.fillText(ch, 0, 0); }
    else { x.strokeStyle = col; x.lineWidth = fs*.024; x.lineJoin = 'round'; x.strokeText(ch, 0, 0); }
    x.restore();
  });
}

/* ---------- HUD ---------- */
function hud(t, energy, fl){
  const pad = Math.max(16, S*.035);
  const ph = Math.max(26, S*.055);
  logo('phoenixPaper', 'phoenix', pad + ph*.283, pad + ph/2, {h: ph});
  logo('wordPaper', 'word', pad + ph*.57 + 10 + Math.max(90, S*.2)/2, pad + ph/2, {w: Math.max(90, S*.2)});
  logo('scriptGold', 'script', W - pad - Math.max(80, S*.17)/2, pad + ph/2, {w: Math.max(80, S*.17)});

  const bw = Math.min(W*.62, 440), seg = 20, gap = 3;
  const sw = (bw - gap*(seg-1))/seg, sh = Math.max(8, S*.014);
  const bx = W/2 - bw/2, by = H - pad - sh;
  const on = Math.round(energy*seg), full = energy >= 1;
  for (let i = 0; i < seg; i++){
    x.fillStyle = i < on ? (full && Math.sin(t*14) > 0 ? C.gold : C.accent) : 'rgba(247,242,236,.12)';
    x.fillRect(bx + i*(sw+gap), by, sw, sh);
  }
  x.font = `400 ${Math.max(9, S*.014)}px ${FONT}`; x.textBaseline = 'bottom';
  x.textAlign = 'left'; x.fillStyle = C.paper; x.fillText('КОФЕИН', bx, by - 6);
  x.textAlign = 'right';
  x.fillText(String(Math.round(energy*100)).padStart(3,'0') + '%', bx + bw, by - 6);
  if (t > T_BURST){
    x.textAlign = 'center'; x.fillStyle = C.gold;
    x.fillText(`0${fl.i+1} / 06 · ${FLAVORS[fl.i].name.toUpperCase()}`, W/2, by - 6);
  }
}

/* ---------- события ---------- */
function splash(cx, cy){
  rings.push({t:0, col:C.gold, w:3}, {t:-.12, col:C.accent, w:2});
  for (let i = 0; i < 26; i++){
    const a = rnd(-Math.PI, 0), v = rnd(.25, .9)*S;
    drops.push({x:cx, y:cy, vx:Math.cos(a)*v, vy:Math.sin(a)*v, r:rnd(2, 5), life:1});
  }
}
function throwBeans(cx, cy, n, cols, power){
  for (let i = 0; i < n; i++){
    const a = rnd(0, Math.PI*2), v = rnd(.5, 2.2)*S*power;
    beans.push({x:cx + rnd(-20,20), y:cy + rnd(-40,40), vx:Math.cos(a)*v, vy:Math.sin(a)*v,
      age:0, r:rnd(.012, .032)*S, a:rnd(0, 6.3), va:rnd(-12, 12), col:cols[Math.floor(Math.random()*cols.length)]});
  }
  if (beans.length > 260) beans.splice(0, beans.length - 260);
}
function burst(cx, cy){
  throwBeans(cx, cy, 90, [C.gold, C.gold, C.goldDeep, FLAVORS[0].band], 1);
  rings.push({t:0, col:C.paper, w:6}, {t:-.08, col:C.accent, w:10}, {t:-.2, col:C.gold, w:3});
  for (let i = 0; i < 90; i++) streaks.push(newStreak(true));
}
function newStreak(near){
  return {a:rnd(0, Math.PI*2), r:near ? rnd(0, S*.3) : rnd(S*.15, S*.4), len:rnd(.04, .18)*S, v:rnd(.9, 2.6)*S};
}

/* ---------- кадр ---------- */
function frame(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  const t = ((now - t0)/1000) % L;
  if (t < prevT){ splashed = false; bursted = false; lastFlav = 0; beans = []; streaks = []; drops = []; rings = []; }
  prevT = t;

  const cx = W/2, cy = H/2;
  const ch = Math.min(H*.66, W*1.15), cw = ch/2.73;
  const charge = prog(t, T_CHARGE, T_BURST);
  const energy = t >= T_BURST ? 1 : charge;
  const fl = flavorAt(t);
  const tone = FLAVORS[fl.i].band;

  if (!splashed && t >= T_DROP){ splashed = true; splash(cx, cy); }
  if (!bursted && t >= T_BURST){ bursted = true; burst(cx, cy); }
  if (fl.i !== lastFlav && t > T_FLAV0){
    lastFlav = fl.i;
    throwBeans(cx, cy, 22, [tone, C.gold], .7);
    rings.push({t:0, col:tone, w:5});
  }

  const shake = t < T_BURST ? eIn(charge)*S*.014
    : Math.max(0, 1 - (t - T_BURST)*3)*S*.03 + (fl.k < 1 && t > T_FLAV0 ? (1 - fl.k)*S*.006 : 0);

  x.fillStyle = C.ink; x.fillRect(0, 0, W, H);
  x.save();
  if (t > T_WIPE){
    const k = eIn(prog(t, T_WIPE, T_END));
    x.beginPath(); x.arc(cx, cy, Math.hypot(W, H)*.6*(1 - k), 0, Math.PI*2); x.clip();
  }
  x.translate(rnd(-1,1)*shake, rnd(-1,1)*shake);

  // лучи скорости
  x.strokeStyle = tone; x.lineCap = 'round'; x.globalAlpha = .5; x.lineWidth = Math.max(1, S*.003);
  streaks.forEach(s => {
    s.r += s.v*dt;
    if (s.r > Math.hypot(W, H)*.7) Object.assign(s, newStreak(false));
    const c = Math.cos(s.a), sn = Math.sin(s.a);
    x.beginPath(); x.moveTo(cx + c*s.r, cy + sn*s.r); x.lineTo(cx + c*(s.r+s.len), cy + sn*(s.r+s.len)); x.stroke();
  });
  x.globalAlpha = 1;

  // фоновые зёрна
  if (t > T_BURST + .3 && t < T_WIPE && Math.random() < .25)
    floaters.push({x:rnd(0, W), y:H + 30, vy:rnd(.05, .14)*S, r:rnd(.008, .02)*S, a:rnd(0, 6), va:rnd(-1, 1)});
  floaters = floaters.filter(f => f.y > -40 && t > 1);
  x.globalAlpha = .22;
  floaters.forEach(f => { f.y -= f.vy*dt; f.a += f.va*dt; bean(f.x, f.y, f.r, f.a, C.gold); });
  x.globalAlpha = 1;

  // пульс
  if (t > T_DROP){
    const amp = S*(.03 + energy*.12)*clamp((t - T_DROP)*2);
    const period = S*.55, speed = S*(.35 + energy*1.2);
    x.strokeStyle = t > T_BURST ? tone : C.accent; x.lineWidth = Math.max(2, S*.004); x.lineJoin = 'round';
    x.beginPath();
    for (let px = 0; px <= W; px += 3){
      const y = cy - ecg((px + t*speed)/period)*amp;
      px === 0 ? x.moveTo(px, y) : x.lineTo(px, y);
    }
    x.stroke();
  }

  // заголовок
  if (t > T_BURST){
    const tmp = wordLayout('ЭНЕРГЕТИК', 100);
    const fs = Math.min(W*.94/tmp.total*100, H*.19);
    const glitch = Math.random() < .06 || (fl.k < .4 && t > T_FLAV0);
    drawWord('КОФЕЙНЫЙ', cy - fs*.6, fs, T_BURST + .05, t, 'fill', C.gold, glitch);
    drawWord('ЭНЕРГЕТИК', cy + fs*.6, fs, T_BURST + .3, t, 'stroke', tone, glitch && Math.random() < .5);
  }

  // положение банки
  let canY = cy, canS = 0, rot = 0;
  if (t >= T_CAN){
    const k = prog(t, T_CAN, T_CHARGE);
    canS = eElastic(k);
    canY = cy + (1 - eOut(k))*H*.25;
    rot = (1 - eOut(k))*-.5;
    if (t > T_BURST){
      canY += Math.sin(t*2.2)*S*.012 + my*S*.04;
      rot = Math.sin(t*1.4)*.05 + mx*.35 + (fl.k < 1 && t > T_FLAV0 ? Math.sin(fl.k*Math.PI)*.08 : 0);
      canS *= 1 + Math.max(0, .14 - (t - T_BURST)*.5);
    } else rot += Math.sin(t*60)*eIn(charge)*.05;
  }

  // молнии
  if ((t > T_CHARGE + .5 && t < T_BURST + .4) || (t > T_BURST && t < T_WIPE && Math.random() < .05)){
    const n = t < T_BURST ? Math.floor(charge*6) : 2;
    for (let i = 0; i < n; i++){
      if (Math.random() < .35) continue;
      const a = rnd(0, Math.PI*2);
      const sx = cx + Math.cos(a)*cw*.45*canS, sy = canY + Math.sin(a)*ch*.45*canS;
      const d = rnd(.22, .48)*S;
      bolt(sx, sy, sx + Math.cos(a)*d, sy + Math.sin(a)*d, t > T_BURST ? tone : C.accent);
    }
  }

  // капля
  if (t < T_DROP){
    const k = eIn(prog(t, 0, T_DROP));
    const dy = -S*.1 + (cy + S*.1)*k, r = S*.022;
    x.fillStyle = C.gold; x.beginPath();
    x.moveTo(cx, dy - r*2.6);
    x.bezierCurveTo(cx + r*.4, dy - r*1.4, cx + r, dy - r*.6, cx + r, dy);
    x.arc(cx, dy, r, 0, Math.PI);
    x.bezierCurveTo(cx - r, dy - r*.6, cx - r*.4, dy - r*1.4, cx, dy - r*2.6);
    x.fill();
  }

  if (canS > .001){
    const fill = t >= T_BURST ? 1 : eOut(charge);
    drawCan(cx, canY, cw*canS, ch*canS, rot, fill, t, fl);
  }

  drops = drops.filter(d => d.life > 0);
  x.fillStyle = C.gold;
  drops.forEach(d => {
    d.vy += S*2.2*dt; d.x += d.vx*dt; d.y += d.vy*dt; d.life -= dt*1.4;
    x.globalAlpha = clamp(d.life); x.beginPath(); x.arc(d.x, d.y, d.r, 0, Math.PI*2); x.fill();
  });
  x.globalAlpha = 1;

  beans = beans.filter(b => b.age < 2.6);
  beans.forEach(b => {
    b.age += dt; x.globalAlpha = 1 - prog(b.age, 1.6, 2.6);
    const drag = Math.pow(.18, dt);
    b.vx *= drag; b.vy *= drag; b.vy += S*.12*dt;
    b.x += b.vx*dt; b.y += b.vy*dt; b.a += b.va*dt; b.va *= drag;
    bean(b.x, b.y, b.r, b.a, b.col);
  });
  x.globalAlpha = 1;

  rings = rings.filter(r => r.t < 1.4);
  rings.forEach(r => {
    r.t += dt; if (r.t <= 0) return;
    const k = eOut(clamp(r.t/1.4));
    x.globalAlpha = 1 - k; x.strokeStyle = r.col; x.lineWidth = r.w*(1 - k) + 1;
    x.beginPath(); x.arc(cx, cy, k*S*.9, 0, Math.PI*2); x.stroke();
  });
  x.globalAlpha = 1;
  x.restore();

  if (t > .2 && t < T_END){
    x.save();
    x.globalAlpha = t > T_WIPE ? 1 - prog(t, T_WIPE, T_WIPE + .4) : clamp((t - .2)*3);
    hud(t, energy, fl);
    x.restore();
  }

  if (t > T_BURST && t < T_BURST + .35){
    x.fillStyle = C.gold; x.globalAlpha = (1 - prog(t, T_BURST, T_BURST + .35))*.9;
    x.fillRect(0, 0, W, H); x.globalAlpha = 1;
  }
  requestAnimationFrame(frame);
}

/* ---------- старт ---------- */
const fonts = document.fonts ? Promise.all([
  document.fonts.load(`800 40px Unbounded`), document.fonts.load(`800 40px UBL`),
  document.fonts.load(`400 20px UBL`), document.fonts.load(`40px "Caveat Brush"`)
]).catch(() => {}) : Promise.resolve();
const imgs = Promise.all([
  tint('phoenix', C.ink).then(i => IMG.phoenixInk = i),
  tint('phoenix', C.paper).then(i => IMG.phoenixPaper = i),
  tint('word', C.ink).then(i => IMG.wordInk = i),
  tint('word', C.paper).then(i => IMG.wordPaper = i),
  tint('script', C.goldLight).then(i => IMG.scriptLight = i),
  tint('script', C.gold).then(i => IMG.scriptGold = i),
]);
Promise.race([Promise.all([fonts, imgs]), new Promise(r => setTimeout(r, 2000))]).then(() => imgs).then(() => {
  t0 = performance.now(); last = t0; requestAnimationFrame(frame);
  if (window.parent !== window) window.parent.postMessage({ type: 'bumble-energy:started' }, window.location.origin);
});
})();
</script>
</body>
</html>
